services:
  mysql:
    image: mysql:8.0
    container_name: fireguard_mysql_dev
    restart: always
    environment:
      MYSQL_DATABASE: fireguard_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: fireguard_user
      MYSQL_PASSWORD: devpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    networks:
      - fireguard_dev_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0-alpine
    container_name: fireguard_redis_dev
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - fireguard_dev_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-28T22-35-53Z
    container_name: fireguard_minio_dev
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - minio_dev_data:/data
    command: server /data --console-address ":9001"
    networks:
      - fireguard_dev_network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: fireguard_ai_dev
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service:/app
    environment:
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadminpassword
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - fireguard_dev_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fireguard_backend_dev
    restart: always
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=fireguard_db;User Id=fireguard_user;Password=devpassword;
      - Redis__Configuration=redis:6379
      - Minio__Endpoint=minio:9000
      - Minio__AccessKey=minioadmin
      - Minio__SecretKey=minioadminpassword
      - Jwt__Secret=super_secret_jwt_key_with_at_least_32_characters_123456
      - AIService__BaseUrl=http://ai-service:8000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fireguard_dev_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fireguard_frontend_dev
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - fireguard_dev_network

networks:
  fireguard_dev_network:
    name: fireguard_dev_network
    driver: bridge

volumes:
  mysql_dev_data:
  redis_dev_data:
  minio_dev_data:
